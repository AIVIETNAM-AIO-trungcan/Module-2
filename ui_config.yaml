# ==============================================================================
# CREDIT RISK SCORECARD ENGINE - USER INTERFACE & LOCALIZATION CONFIGURATION
# ==============================================================================
# Description: Configuration schema managing internationalization (i18n),
#              layout parameters, currency exchange rates, UI mascot responses,
#              categorical value mappings, and admin access controls.
# Maintainer : Porsche Club
# ==============================================================================

# ------------------------------------------------------------------------------
# PROJECT METADATA & BRANDING
# ------------------------------------------------------------------------------
project_info:
  title: "Module 2: Credit Risk Scoring and Decision Support System"
  subtitle: "Automated Credit Risk Assessment & Decision Support System"
  team_name: "Porsche_Club"
  logo_path: "asset/capybara_main.png"

# ------------------------------------------------------------------------------
# CURRENCY CONVERSION & FORMATTING PARAMETERS
# ------------------------------------------------------------------------------
currency:
  symbol_vnd: "VND"
  symbol_usd: "USD"
  usd_to_vnd_rate: 25000 # Exchange rate conversion factor: 1 USD = 25,000 VND
  thousand_separator: "."
  decimal_separator: ","

# ------------------------------------------------------------------------------
# MASCOT & DECISION RESPONSE CONFIGURATION
# ------------------------------------------------------------------------------
mascot:
  default_image: "asset/capybara_main.png"
  outcomes:
    APPROVED:
      image: "asset/capybara_success.png"
      status_color: "#28a745"
      dialogue:
        vi: "🎉 Chúc mừng! Khoản vay của bạn đã được TỰ ĐỘNG PHÊ DUYỆT!"
        en: "🎉 Congratulations! Your loan application is AUTOMATICALLY APPROVED!"
    MANUAL_REVIEW:
      image: "asset/capybara_confuse.png"
      status_color: "#ffc107"
      dialogue:
        vi: "🧐 Hồ sơ của bạn cần được chuyên viên thẩm định xem xét thêm nhé!"
        en: "🧐 Your application requires further verification by a credit officer!"
    REJECTED:
      image: "asset/capybara_refuse.png"
      status_color: "#dc3545"
      dialogue:
        vi: "😔 Rất tiếc, điểm tín dụng hiện tại chưa đủ điều kiện cấp hạn mức."
        en: "😔 Unfortunately, your current credit risk profile exceeds our risk threshold."

