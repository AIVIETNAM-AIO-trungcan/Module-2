# ==============================================================================
# CREDIT RISK SCORECARD ENGINE - USER INTERFACE CONFIGURATION
# ==============================================================================
# Description: Configuration schema for localization (i18n), layout parameters,
#              currency rates, and UI mascot responses.
# Maintainer : Group 05 - FinTech Innovation
# ==============================================================================

project_info:
  title: "Credit Risk Scorecard Engine"
  subtitle: "Automated Credit Risk Assessment & Scoring System"
  team_name: "Group 05 - FinTech Innovation"
  logo_path: "asset/images/team_logo.png"

currency:
  symbol_vnd: "VND"
  symbol_usd: "USD"
  usd_to_vnd_rate: 25000 # Exchange rate conversion factor: 1 USD = 25,000 VND
  thousand_separator: "."
  decimal_separator: ","

mascot:
  default_image: "asset/images/mascot_neutral.png"
  outcomes:
    APPROVED:
      image: "asset/images/mascot_approved.png"
      status_color: "#28a745"
      dialogue:
        vi: "🎉 Chúc mừng! Khoản vay của bạn đã được TỰ ĐỘNG PHÊ DUYỆT!"
        en: "🎉 Congratulations! Your loan application is AUTOMATICALLY APPROVED!"
    MANUAL_REVIEW:
      image: "asset/images/mascot_review.png"
      status_color: "#ffc107"
      dialogue:
        vi: "🧐 Hồ sơ của bạn cần được chuyên viên xem xét thêm nhé!"
        en: "🧐 Your application requires further verification by a credit officer!"
    REJECTED:
      image: "asset/images/mascot_rejected.png"
      status_color: "#dc3545"
      dialogue:
        vi: "😔 Rất tiếc, điểm tín dụng hiện tại chưa đủ điều kiện vay."
        en: "😔 Unfortunately, your current credit risk profile exceeds our risk threshold."

