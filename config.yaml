# Central Pipeline Configuration File
# -----------------------------------
# Purpose:
#     This file acts as the master control panel for the credit scoring project.
#     It allows to adjust features and model parameters dynamically.
#
# Usages:
#     Modified directly by team members to configure paths, features, and models
#     without changing any underlying Python source code.

# 1. Define raw data file and dataset splitting parameters
data:
  # The raw dataset file name stored inside the data/raw folder
  raw_file_name: "credit_risk_dataset.csv"

  # PREPROCESSING TOGGLE:
  # "notebook_match" : Hard-drops legacy anomalies before splitting to match original Jupyter Notebook exactly (31,679 rows).
  # "mlops_optimized": Retains full dataset, relies on Z-score/IQR capping and OptBinning 'Missing' bins for robust production.
  preprocessing_mode: "notebook_match"

  split_params:
    test_size: 0.20 # Percent of data saved for final testing (20%)
    cv_folds: 10 # Number of folds for Stratified Cross-Validation on the Train set
    random_state: 42 # Controls shuffling to ensure repeatable splits
    stratify: true # Keeps the balance of bad customers equal across splits

# 2. Validate data
validation:
  person_age:
    min: 18
    max: 99
  person_income:
    min: 1
  person_emp_length:
    min: 0
    max: 99
  loan_amnt:
    min: 1
  loan_int_rate:
    min: 0
  cb_person_cred_hist_length:
    min: 0

# 2.1. Tier-1 Data Cleaning Configuration (Outlier Handling & Imputation)
cleaning_config:
  outlier_handling:
    enabled: true
    strategy: "capping" # Preserves training volume by capping instead of dropping
    method: "zscore" # Options: "zscore" or "iqr"

    # Mathematical thresholds for the selected method
    zscore_threshold: 3.0 # Target extreme outliers only (|Z| > 3)
    iqr_multiplier: 3.0 # Target extreme outliers (beyond Q1/Q3)

    target_columns:
      - "person_age"
      - "person_emp_length"
      - "cb_person_cred_hist_length"

  # Strict Banking Rule: Disable imputation to let OptBinning handle Missing values as a separate risk bin
  imputation:
    enabled: false

# 3. Compute new data
derived_features:
  loan_percent_income_computed:
    columns:
      - loan_amnt
      - person_income
    precision: 4

# 4. Define analytical feature groupings for the pipeline
features:
  # Columns containing continuous numbers to be cleaned and binned
  numerical:
    - "person_age"
    - "person_income"
    - "person_emp_length"
    - "loan_amnt"
    - "loan_int_rate"
    - "loan_percent_income" # <--- UPDATED: Using raw feature to match Notebook
    - "cb_person_cred_hist_length"

  # Column containing text categories to be cleaned and mapped to WoE
  categorical:
    - "person_home_ownership"
    - "loan_intent"
    - "cb_person_default_on_file"
    - "loan_grade"

  # Dynamic bin counts and OptBinning configurations
  bin_config:
    prebinning_method: "cart"
    solver: "cp"
    divergence: "iv"
    max_n_prebins: 20
    min_prebin_size: 0.05
    max_n_bins: 6 # <--- UPDATED: Increased from 5 to 6 to match Notebook
    monotonic_trend: "auto"
    # Manual overrides for specific columns removed to ensure uniformity

  # Settings for WOE validation and diagnostics
  woe_diagnostics:
    small_bin_threshold: 0.05
    extreme_woe_threshold: 2.0

  # Feature selection rules
  selection_config:
    # Tier 1: Baseline Filters (Information Preservation)
    min_iv_threshold: 0.02 # Exclude uninformative variables
    max_iv_threshold: 1.00 # Set high to retain strong predictors; auto-disqualified if leaking

    # Tier 2: Explainable Pre-decision Rules
    explainable_rules:
      enabled: true
      post_decision_features:
        - "loan_grade"
        - "loan_int_rate"
      redundancy_drop:
        - "loan_amnt"
        - "person_income"
      redundancy_keep: "loan_percent_income" # <--- UPDATED: Using raw feature

    # Tier 3: Champion Model Auto-Selection Logic (1-SE Rule via 10-Fold CV)
    champion_selection:
      # Context defines business validity. "pre_decision" automatically disqualifies models with post-decision features.
      prediction_context: "pre_decision"
      primary_metric: "roc_auc"
      use_1_se_rule: true # Applies the 1-Standard Error rule to favor parsimonious (simpler) models
      # Manual governance override (e.g. set to "subset" to force selection regardless of CV results)
      manual_override: null

# 5. Define target variable for model prediction
target: "loan_status" # The column name where 1 = Bad and 0 = Good customer

# 6. Define Hyperparameters for the baseline machine learning model
model:
  # Notebook 4 transitions to statsmodels.GLM without penalty for inference
  logistic_regression:
    random_state: 42
    # Regulatory Audit Thresholds for Coefficient & Multi-collinearity checks
    p_value_threshold: 0.05
    vif_threshold: 5.0

# 7. Scorecard Scaling Parameters (Financial Engineering Constants)
scorecard_scaling:
  base_score: 600 # Target benchmark score
  base_odds: 50.0 # Good-to-Bad ratio at the base score (50:1)
  pdo: 20 # Points to Double the Odds

# 8. Business Decision Cutoff Thresholds (UI Decision Rules)
scoring_thresholds:
  approval_score: 533 # Score >= 533: Automatic Approval
  review_score: 503 # 503 <= Score < 533: Manual Underwriter Review. Score < 503: Rejection

# 9. Inference Engine & Model Deployment Settings
inference:
  mode: "auto" # Execution mode: "auto" or "manual"
  manual_run_dir: "2026-07-25_run_4" # Target folder name inside artifacts/runs/
  artifacts_download_url: "https://huggingface.co/datasets/trungcan94/AIO_moddule_2_model/raw/main/model.zip"
