# Central Pipeline Configuration File
# -----------------------------------
# Purpose:
#     This file acts as the master control panel for the credit scoring project.
#     It allows to adjust features and model parameters dynamically.
#
# Usages:
#     Modified directly by team members to configure paths, features, and models
#     without changing any underlying Python source code.

# 1. Define raw data file and dataset splitting parameters
data:
  # The raw dataset file name stored insided the data/raw folder
  raw_file_name: "credit_risk_dataset.csv"

  split_params:
    test_size: 0.2 # Percent of data saved for final testing (20%)
    val_size: 0.16 # Percent of data saved for validation: 16% total data (equals 20% of remaining train data)
    random_state: 42 # Controls shuffling to ensure repeatable splits
    stratify: true # Keeps the balance of bad customers equal across splits

# 2. Validate data
validation:
  person_age:
    min: 18
    max: 99

  person_income:
    min: 1

  person_emp_length:
    min: 0
    max: 99

  loan_amnt:
    min: 1

  loan_int_rate:
    min: 0

  cb_person_cred_hist_length:
    min: 0

# 2.1. Tier-1 Data Cleaning Configuration (Outlier Handling)
cleaning_config:
  outlier_handling:
    enabled: true
    strategy: "drop" # Drop extreme outliers directly to preserve binning monotonicity
    method: "zscore" # Options: "zscore" or "iqr". Toggle this to switch the mathematical logic used in Python.

    # Mathematical thresholds for the selected method
    zscore_threshold: 3.0 # Target extreme outliers only (|Z| > 3 represents ~0.3% of normally distributed data)
    iqr_multiplier: 3.0 # Target extreme outliers (1.5 is standard, 3.0 captures extreme deviations beyond Q1/Q3)

    target_columns:
      - "person_age"
      - "person_emp_length"
      - "cb_person_cred_hist_length"

# 3. Compute new data
derived_features:
  loan_percent_income_computed:
    columns:
      - loan_amnt
      - person_income
    precision: 4

# 4. Define analytical feature groupings for the pipeline
features:
  # Columns containing continious numbers to be cleaned and binned
  numerical:
    - "person_age"
    - "person_income"
    - "person_emp_length"
    - "loan_amnt"
    - "loan_int_rate"
    - "loan_percent_income_computed"
    - "cb_person_cred_hist_length"

  # Column containing text categories to be cleaned and mapped to WoE
  categorical:
    - "person_home_ownership"
    - "loan_intent"
    - "cb_person_default_on_file"
    - "loan_grade"

  # Dynamic bin counts and OptBinning configurations
  bin_config:
    prebinning_method: "cart"
    solver: "cp"
    divergence: "iv"
    max_n_prebins: 20
    min_prebin_size: 0.05
    max_n_bins: 6
    monotonic_trend: "auto"
    # Manual overrides for specific columns
    default_bins: 5
    person_age: 5
    person_income: 5
    person_emp_length: 4
    loan_amnt: 7

  # Settings for WOE validation and diagnostics
  woe_diagnostics:
    small_bin_threshold: 0.05
    extreme_woe_threshold: 2.0

  # Feature selection rules (Dual-branch: Baseline Full Features vs. Best Subset)
  selection_config:
    # Tier 1: Baseline Filters (Information Preservation)
    min_iv_threshold: 0.02 # Exclude uninformative variables
    max_iv_threshold: 1 # Set high to retain strong predictors; Tech Lead will manually review for leakage
    vif_threshold: 5.0 # Max Variance Inflation Factor to drop highly correlated features
    business_exclude: [] # Add variables here to force exclude them if Tech Lead identifies data leakage

    # Tier 2: Best Subset Selection Method
    best_subset:
      enabled: true
      method: "lasso_cv" # Uses LASSO 1-SE rule for selecting the simplest valid subset
      lasso_cv_splits: 10
      random_state: 42
      lasso_max_iter: 10000
      lasso_solver: "saga"
      penalty: "l1"
      l1_ratio: 1.0

    # Tier 3: Champion Model Auto-Selection Logic (Validation Set Evaluation)
    champion_selection:
      # Options: "kolmogorov_smirnov_ks", "roc_auc", "f1_score"
      primary_metric: "kolmogorov_smirnov_ks" # The main decider for credit risk separation
      secondary_metric: "roc_auc" # The tie-breaker for overall ranking stability
      margin_of_equivalence: 0.01 # If the primary metric diff is <= 1%, use the secondary metric

# 5. Define target variable for model prediction
target: "loan_status" # The column name where 1 = Bad and 0 = Good customer

# 6. Define Hyperparameters for the baseline machine learning model
model:
  logistic_regression:
    random_state: 42
    max_iter: 1000
    c_parameter: 1.0

# 7. Scorecard Scaling Parameters (Financial Engineering Constants)
scorecard_scaling:
  base_score: 600 # Target benchmark score
  base_odds: 50.0 # Good-to-Bad ratio at the base score (50:1)
  pdo: 20 # Points to Double the Odds

# 8. Business Decision Cutoff Thresholds (UI Decision Rules)
scoring_thresholds:
  approval_score: 600 # Score >= 600: Automatic Approval
  review_score: 500 # 500 <= Score < 600: Manual Underwriter Review. Score < 580: Rejection

# 9. Inference Engine & Model Deployment Settings
# ------------------------------------------------------------------------------
# Purpose: Controls how artifacts are loaded and evaluated during Streamlit / API execution.
# Mode options:
#   - "auto"   : Automatically selects the latest run directory inside the artifacts folder.
#   - "manual" : Uses the explicit path provided in 'manual_run_dir'.
# ------------------------------------------------------------------------------
inference:
  mode: "auto" # Execution mode: "auto" or "manual"
  manual_run_dir: "2026-07-25_run_4" # Target folder name inside artifacts/runs/
  artifacts_download_url: "https://huggingface.co/datasets/trungcan94/AIO_moddule_2_model/raw/main/model.zip"
